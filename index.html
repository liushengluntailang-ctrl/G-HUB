<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>G-HUB // Next-Gen Indie Gaming</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen font-sans selection:bg-indigo-500 selection:text-white">
  <div class="fixed inset-0 bg-[linear-gradient(to_right,#1f293710_1px,transparent_1px),linear-gradient(to_bottom,#1f293710_1px,transparent_1px)] bg-[size:4rem_4rem] pointer-events-none"></div>

  <div class="relative max-w-7xl mx-auto px-4 py-6">
    <!-- ナビバー -->
    <header class="flex flex-wrap justify-between items-center gap-4 mb-8 bg-[#111827]/80 backdrop-blur-md p-4 rounded-2xl border border-slate-800 shadow-2xl">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 rounded-xl flex items-center justify-center text-xl font-black shadow-lg">G</div>
        <div>
          <h1 class="text-2xl font-black tracking-widest bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">G-HUB</h1>
          <p class="text-[10px] text-slate-400 font-mono tracking-widest">NEXT-GEN INDIE HUB</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <!-- 🪙 G-コイン ＆ 🎰 ガチャ -->
        <div id="coin-section" class="hidden flex items-center gap-2">
          <div class="bg-amber-950/60 border border-amber-500/40 px-3 py-1.5 rounded-xl flex items-center gap-1.5 text-xs font-bold text-amber-400">
            🪙 <span id="coin-count">0</span> G
          </div>
          <button onclick="openGachaModal()" class="bg-gradient-to-r from-amber-500 to-pink-500 hover:opacity-90 px-3 py-1.5 rounded-xl text-xs font-bold text-slate-950 shadow-lg transition">
            🎰 ガチャ
          </button>
        </div>

        <div id="user-stats" class="hidden flex items-center gap-2">
          <div class="bg-amber-500/20 border border-amber-500/40 px-2.5 py-1.5 rounded-xl text-xs font-bold text-amber-400">
            🔥 <span id="streak-count">1</span>日
          </div>
          <span id="player-badge" class="bg-indigo-950/80 border border-indigo-500/50 text-indigo-300 text-xs px-2.5 py-1.5 rounded-xl font-bold">🎮 Lv.1</span>
        </div>

        <button onclick="openFriendModal()" class="bg-slate-800/80 hover:bg-slate-700 text-indigo-300 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1">
          👥 フレンド
        </button>

        <div id="auth-status">
          <button onclick="openAuthModal()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-4 py-2 rounded-xl text-xs font-bold transition">
            ログイン
          </button>
        </div>

        <a href="upload.html" class="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-90 px-4 py-2 rounded-xl font-bold text-xs shadow-lg transition">
          ＋ ゲーム公開
        </a>
      </div>
    </header>

    <!-- 🎉 お祭り特設バナー（第1回 G-HUB杯） -->
    <div class="bg-gradient-to-r from-amber-500/20 via-pink-600/20 to-purple-600/20 border border-amber-500/40 p-5 rounded-3xl mb-8 flex flex-col md:flex-row justify-between items-center gap-4 shadow-2xl relative overflow-hidden">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span class="bg-amber-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-md uppercase tracking-wider">開催中のお祭り</span>
          <span class="text-xs text-amber-300 font-mono">🏆 第1回 G-HUB杯</span>
        </div>
        <h2 class="text-xl font-black text-white">テーマ：「1分で遊べる神ゲー」コンテスト！</h2>
        <p class="text-xs text-slate-300 mt-1">エントリー作品をプレイして投票しよう！優勝者には限定「初代チャンピオン」称号を授与！</p>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="filterEventGames()" class="bg-gradient-to-r from-amber-500 to-pink-500 hover:opacity-90 text-slate-950 font-black px-5 py-2.5 rounded-xl text-xs shadow-lg transition whitespace-nowrap">
          🎉 エントリー作品を見る
        </button>
      </div>
    </div>

    <!-- 検索 & フィルター -->
    <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
      <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0" id="tag-filters">
        <button onclick="setTag('All')" class="tag-btn active px-4 py-1.5 rounded-xl text-xs font-bold bg-indigo-600 text-white transition">すべて</button>
        <button onclick="setTag('Action')" class="tag-btn px-4 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-400 hover:text-white transition">アクション</button>
        <button onclick="setTag('Puzzle')" class="tag-btn px-4 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-400 hover:text-white transition">パズル</button>
        <button onclick="filterPlatform('mobile')" class="tag-btn px-4 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-emerald-400 hover:text-emerald-300 transition">📱 スマホ対応</button>
        <button onclick="filterPlatform('pad')" class="tag-btn px-4 py-1.5 rounded-xl text-xs font-bold bg-slate-800 text-purple-400 hover:text-purple-300 transition">🎮 パッド対応</button>
      </div>

      <div class="flex gap-2 w-full md:w-auto">
        <input type="text" id="search-input" oninput="filterGames()" placeholder="🔍 タイトルで検索..." class="w-full md:w-72 bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-xs outline-none focus:border-indigo-500">
        <button onclick="toggleSort()" id="sort-btn" class="bg-slate-800 border border-slate-700 px-3 py-2 rounded-xl text-xs font-bold text-slate-300">
          🔥 人気順
        </button>
      </div>
    </div>

    <div id="game-list" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <p class="text-slate-500 col-span-4 text-center py-10 font-mono">ゲームを読み込み中...</p>
    </div>
  </div>

  <!-- 🎰 ガチャモーダル -->
  <div id="gacha-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 hidden z-50">
    <div class="bg-[#111827] border border-amber-500/40 p-6 rounded-3xl max-w-sm w-full shadow-2xl text-center">
      <h2 class="text-xl font-black text-amber-400 mb-1">🎰 ネオンスキンガチャ</h2>
      <p class="text-xs text-slate-400 mb-4">1回 100 G（チャットの名前が光る！）</p>

      <div id="gacha-display" class="bg-slate-950 p-6 rounded-2xl border border-slate-800 mb-4 flex items-center justify-center min-h-[100px]">
        <span class="text-slate-500 text-xs">ボタンを押してガチャを回そう！</span>
      </div>

      <button onclick="playGacha()" class="w-full bg-gradient-to-r from-amber-500 to-pink-500 hover:opacity-90 text-slate-950 font-black py-3 rounded-xl text-sm shadow-lg mb-2">
        100 G で回す！
      </button>
      <button onclick="closeGachaModal()" class="text-slate-500 hover:text-slate-300 text-xs py-1">閉じる</button>
    </div>
  </div>

  <!-- フレンドモーダル -->
  <div id="friend-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-900 border border-slate-700 p-6 rounded-3xl max-w-md w-full shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-indigo-400">👥 フレンド一覧</h2>
        <button onclick="closeFriendModal()" class="text-slate-400 hover:text-white text-xs">✕ 閉じる</button>
      </div>
      <form id="friend-form" class="flex gap-2 mb-4">
        <input type="email" id="friend-email" placeholder="友達のメールアドレス" required class="flex-1 bg-slate-950 border border-slate-700 px-3 py-2 rounded-xl text-xs outline-none">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 font-bold px-4 py-2 rounded-xl text-xs">追加</button>
      </form>
      <div id="friends-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
    </div>
  </div>

  <!-- ログインモーダル -->
  <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-900 border border-slate-700 p-6 rounded-3xl max-w-sm w-full shadow-2xl">
      <h2 id="auth-title" class="text-xl font-bold mb-4 text-indigo-400">ログイン</h2>
      <div class="space-y-3">
        <input type="email" id="auth-email" placeholder="メールアドレス" class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl text-xs outline-none">
        <input type="password" id="auth-password" placeholder="パスワード" class="w-full bg-slate-950 border border-slate-700 p-3 rounded-xl text-xs outline-none">
        <button id="auth-submit-btn" onclick="handleAuth()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold text-xs transition">ログイン</button>
      </div>
      <div class="mt-4 text-center text-xs text-slate-400">
        <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="hover:text-indigo-400 underline">アカウント新規登録</button>
      </div>
      <button onclick="closeAuthModal()" class="mt-3 w-full text-slate-500 text-xs py-1">閉じる</button>
    </div>
  </div>

  <script type="module">
    const proxyUrl = window.location.origin + '/supabase';
    const client = window.supabase.createClient(proxyUrl, 'sb_publishable_cSX9rcWTjbX6lWfyT1KLNQ_tUFYuXtj');
    window.client = client;

    let allGames = [];
    let currentTag = 'All';
    let currentPlat = null;
    let onlyEvent = false;
    let currentSort = 'likes_count';
    let currentUser = null;
    let userCoins = 0;

    async function loadGames() {
      const { data } = await client.from('games').select('*').order(currentSort, { ascending: false });
      allGames = data || [];
      renderGames();
    }

    window.setTag = (tag) => {
      currentTag = tag;
      currentPlat = null;
      onlyEvent = false;
      renderGames();
    };

    window.filterPlatform = (plat) => {
      currentPlat = plat;
      currentTag = 'All';
      onlyEvent = false;
      renderGames();
    };

    window.filterEventGames = () => {
      onlyEvent = true;
      currentTag = 'All';
      currentPlat = null;
      renderGames();
    };

    window.toggleSort = () => {
      currentSort = currentSort === 'likes_count' ? 'created_at' : 'likes_count';
      document.getElementById('sort-btn').innerText = currentSort === 'likes_count' ? '🔥 人気順' : '✨ 新着順';
      loadGames();
    };

    window.filterGames = () => renderGames();

    function renderGames() {
      const q = document.getElementById('search-input').value.toLowerCase();
      let filtered = allGames.filter(g => g.title.toLowerCase().includes(q));

      if (onlyEvent) filtered = filtered.filter(g => g.is_event);
      if (currentPlat) filtered = filtered.filter(g => (g.platforms || '').includes(currentPlat));
      if (currentTag !== 'All') filtered = filtered.filter(g => g.tag === currentTag);

      const list = document.getElementById('game-list');
      if (filtered.length === 0) return list.innerHTML = '<p class="text-slate-500 col-span-4 text-center py-10 font-mono">ゲームがありません。</p>';

      list.innerHTML = filtered.map(g => {
        const plats = (g.platforms || 'pc').split(',');
        const badges = plats.map(p => p === 'mobile' ? '📱' : p === 'pad' ? '🎮' : '💻').join(' ');

        return `
          <a href="play.html?id=${g.id}" class="group bg-[#111827] border border-slate-800/80 rounded-2xl overflow-hidden hover:border-indigo-500/80 hover:-translate-y-1.5 transition duration-300 block shadow-xl relative">
            ${g.is_event ? '<span class="absolute top-2 right-2 z-10 bg-amber-500 text-slate-950 font-black text-[9px] px-2 py-0.5 rounded-full shadow">🎉 G-HUB杯</span>' : ''}
            <div class="aspect-video relative overflow-hidden bg-slate-950 flex items-center justify-center">
              ${g.thumbnail_url 
                ? `<img src="${g.thumbnail_url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">`
                : `<div class="text-4xl group-hover:scale-110 transition duration-300">🕹️</div>`
              }
              <div class="absolute bottom-2 left-2 flex gap-1">
                <span class="bg-black/70 backdrop-blur-md border border-white/10 text-[10px] font-bold px-2 py-0.5 rounded-md text-indigo-300">
                  ${badges}
                </span>
                <span class="bg-black/70 backdrop-blur-md border border-white/10 text-[10px] font-bold px-2 py-0.5 rounded-md text-purple-300">
                  ${g.tag || 'Game'}
                </span>
              </div>
            </div>
            <div class="p-4">
              <h2 class="font-bold text-sm text-slate-100 group-hover:text-indigo-400 transition truncate">${g.title}</h2>
              <p class="text-slate-400 text-xs mt-1 line-clamp-2">${g.description || '説明なし'}</p>
              <div class="mt-3 pt-3 border-t border-slate-800/80 flex justify-between text-[11px] text-slate-400 font-bold font-mono">
                <span class="text-rose-400">❤️ ${g.likes_count || 0}</span>
                <span>🎮 ${g.play_count || 0} plays</span>
              </div>
            </div>
          </a>
        `;
      }).join('');
    }

    // ガチャシステム
    const SKINS = [
      { id: 'emerald', name: '🟢 エメラルドネオン', class: 'text-emerald-400 font-bold' },
      { id: 'purple', name: '🟣 サイバーパープル', class: 'text-purple-400 font-bold drop-shadow-[0_0_8px_rgba(168,85,247,0.8)]' },
      { id: 'gold', name: '🟡 ゴールドレジェンド', class: 'text-amber-300 font-black drop-shadow-[0_0_8px_rgba(251,191,36,0.8)]' },
      { id: 'rainbow', name: '🌈 ハイパーレインボー', class: 'bg-gradient-to-r from-red-500 via-green-500 to-blue-500 bg-clip-text text-transparent font-black animate-pulse' }
    ];

    window.openGachaModal = () => document.getElementById('gacha-modal').classList.remove('hidden');
    window.closeGachaModal = () => document.getElementById('gacha-modal').classList.add('hidden');

    window.playGacha = async () => {
      if (userCoins < 100) return alert('コインが足りません！（ゲームを遊んでコインを貯めよう！）');
      
      const newCoins = userCoins - 100;
      const wonSkin = SKINS[Math.floor(Math.random() * SKINS.length)];
      
      await client.from('profiles').update({ coins: newCoins, equipped_skin: wonSkin.id }).eq('email', currentUser.email);
      userCoins = newCoins;
      document.getElementById('coin-count').innerText = newCoins;

      document.getElementById('gacha-display').innerHTML = `
        <div>
          <span class="text-xs text-amber-400 font-bold block mb-1">🎉 スキン獲得＆自動装備！</span>
          <span class="text-lg ${wonSkin.class}">${wonSkin.name}</span>
        </div>
      `;
    };

    async function checkUser() {
      const { data: { user } } = await client.auth.getUser();
      currentUser = user;
      const statusDiv = document.getElementById('auth-status');
      if (user) {
        statusDiv.innerHTML = `
          <span class="text-xs text-indigo-300 font-bold">👤 ${user.email.split('@')[0]}</span>
          <button onclick="logout()" class="text-xs text-slate-500 hover:text-rose-400 ml-2">ログアウト</button>
        `;
        const { data: prof } = await client.from('profiles').select('*').eq('email', user.email).single();
        if (prof) {
          userCoins = prof.coins || 100;
          document.getElementById('coin-section').classList.remove('hidden');
          document.getElementById('coin-count').innerText = userCoins;
          document.getElementById('user-stats').classList.remove('hidden');
          document.getElementById('player-badge').innerText = `🎮 Lv.${prof.player_level || 1}`;
          document.getElementById('streak-count').innerText = prof.streak_count || 1;
        }
      }
    }

    window.logout = async () => { await client.auth.signOut(); window.location.reload(); };

    let isSignUp = false;
    window.openAuthModal = () => document.getElementById('auth-modal').classList.remove('hidden');
    window.closeAuthModal = () => document.getElementById('auth-modal').classList.add('hidden');
    window.toggleAuthMode = () => {
      isSignUp = !isSignUp;
      document.getElementById('auth-title').innerText = isSignUp ? '新規登録' : 'ログイン';
      document.getElementById('auth-submit-btn').innerText = isSignUp ? '登録' : 'ログイン';
    };

    window.handleAuth = async () => {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      if (isSignUp) {
        const { error } = await client.auth.signUp({ email, password });
        if (error) alert(error.message);
        else {
          await client.from('profiles').insert({ email, coins: 100, player_level: 1, player_exp: 0, dev_level: 1, dev_exp: 0, streak_count: 1, last_login: new Date().toISOString().split('T')[0] });
          alert('登録完了！ボーナス 100 G をプレゼントしました！');
          window.location.reload();
        }
      } else {
        const { error } = await client.auth.signInWithPassword({ email, password });
        if (error) alert(error.message);
        else window.location.reload();
      }
    };

    window.openFriendModal = async () => {
      if (!currentUser) return alert('ログインしてください！');
      document.getElementById('friend-modal').classList.remove('hidden');
      loadFriends();
    };
    window.closeFriendModal = () => document.getElementById('friend-modal').classList.add('hidden');

    async function loadFriends() {
      const { data: friends } = await client.from('friends').select('*').eq('user_email', currentUser.email);
      const list = document.getElementById('friends-list');
      if (!friends || friends.length === 0) return list.innerHTML = '<p class="text-slate-500 text-xs text-center">フレンドはいません</p>';
      list.innerHTML = friends.map(f => `
        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
          <span class="text-slate-200">🟢 ${f.friend_email}</span>
          <span class="text-emerald-400 font-bold">ONLINE</span>
        </div>
      `).join('');
    }

    document.getElementById('friend-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const friend_email = document.getElementById('friend-email').value;
      if (friend_email === currentUser.email) return alert('自分自身は追加できません');
      await client.from('friends').insert({ user_email: currentUser.email, friend_email });
      document.getElementById('friend-email').value = '';
      loadFriends();
    });

    loadGames();
    checkUser();
  </script>
</body>
</html>
