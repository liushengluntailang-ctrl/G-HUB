<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>G-HUB - ゲームプラットフォーム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8">
  <div class="max-w-6xl mx-auto">
    <!-- ヘッダー -->
    <header class="flex justify-between items-center mb-8 border-b border-slate-700 pb-5">
      <div class="flex items-center gap-3">
        <h1 class="text-3xl font-black text-indigo-400 tracking-wider">🎮 G-HUB</h1>
        <span class="text-xs bg-indigo-900 text-indigo-300 font-bold px-2 py-0.5 rounded-full border border-indigo-700">PRO</span>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="openFriendModal()" class="bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 px-3.5 py-2 rounded-lg text-sm font-bold flex items-center gap-1.5 transition">
          👥 フレンド
        </button>
        <div id="auth-status">
          <button onclick="openAuthModal()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-4 py-2 rounded-lg text-sm font-bold transition">
            ログイン
          </button>
        </div>
        <a href="upload.html" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-bold text-sm shadow-lg transition">
          ＋ ゲーム投稿
        </a>
      </div>
    </header>

    <!-- 検索 & フィルターバー -->
    <div class="flex flex-col md:flex-row gap-4 justify-between items-center mb-8">
      <input type="text" id="search-input" oninput="filterGames()" placeholder="🔍 ゲームタイトルで検索..." class="w-full md:w-80 bg-slate-800 border border-slate-700 px-4 py-2.5 rounded-xl text-sm outline-none focus:border-indigo-500">
      <div class="flex gap-2">
        <button onclick="sortGames('created_at')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold">新着順</button>
        <button onclick="sortGames('likes_count')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold text-rose-400">❤️ 人気順</button>
      </div>
    </div>

    <!-- ゲーム一覧 -->
    <div id="game-list" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <p class="text-slate-500">ゲームを読み込み中...</p>
    </div>
  </div>

  <!-- フレンドモーダル -->
  <div id="friend-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-md w-full shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-indigo-400">👥 フレンド一覧</h2>
        <button onclick="closeFriendModal()" class="text-slate-400 hover:text-white text-sm">✕ 閉じる</button>
      </div>

      <!-- フレンド追加 -->
      <form id="friend-form" class="flex gap-2 mb-4">
        <input type="email" id="friend-email" placeholder="友達のメールアドレスを入力" required class="flex-1 bg-slate-900 border border-slate-700 px-3 py-2 rounded-lg text-sm outline-none">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 font-bold px-3 py-2 rounded-lg text-sm">追加</button>
      </form>

      <!-- 一覧 -->
      <div id="friends-list" class="space-y-2 max-h-60 overflow-y-auto">
        <p class="text-slate-500 text-sm text-center">フレンドを読み込み中...</p>
      </div>
    </div>
  </div>

  <!-- ログインモーダル -->
  <div id="auth-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-sm w-full shadow-2xl">
      <h2 id="auth-title" class="text-xl font-bold mb-4 text-indigo-400">ログイン</h2>
      <div class="space-y-3">
        <input type="email" id="auth-email" placeholder="メールアドレス" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm outline-none">
        <input type="password" id="auth-password" placeholder="パスワード" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg text-sm outline-none">
        <button id="auth-submit-btn" onclick="handleAuth()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-lg font-bold text-sm transition">ログイン</button>
      </div>
      <div class="mt-4 text-center text-xs text-slate-400">
        <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="hover:text-indigo-400 underline">アカウント新規登録</button>
      </div>
      <button onclick="closeAuthModal()" class="mt-3 w-full text-slate-500 text-xs py-1">閉じる</button>
    </div>
  </div>

  <script type="module">
    const proxyUrl = window.location.origin + '/supabase';
    const client = window.supabase.createClient(proxyUrl, 'sb_publishable_cSX9rcWTjbX6lWfyT1KLNQ_tUFYuXtj');
    window.client = client;

    let allGames = [];
    let currentUser = null;

    async function loadGames(sortBy = 'created_at') {
      const { data } = await client.from('games').select('*').order(sortBy, { ascending: false });
      allGames = data || [];
      renderGames(allGames);
    }

    window.sortGames = (sort) => loadGames(sort);

    window.filterGames = () => {
      const q = document.getElementById('search-input').value.toLowerCase();
      renderGames(allGames.filter(g => g.title.toLowerCase().includes(q)));
    };

    function renderGames(games) {
      const list = document.getElementById('game-list');
      if (games.length === 0) return list.innerHTML = '<p class="text-slate-500 col-span-3">ゲームが見つかりませんでした。</p>';
      list.innerHTML = games.map(g => `
        <a href="play.html?id=${g.id}" class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden hover:border-indigo-500 hover:-translate-y-1 transition duration-200 block shadow-lg">
          <div class="bg-slate-950 aspect-video flex items-center justify-center text-4xl">🕹️</div>
          <div class="p-4">
            <h2 class="font-bold text-lg text-slate-100">${g.title}</h2>
            <p class="text-slate-400 text-sm mt-1 line-clamp-2">${g.description || '説明なし'}</p>
            <div class="mt-3 pt-3 border-t border-slate-700/50 flex justify-between text-xs text-slate-400 font-bold">
              <span>❤️ ${g.likes_count || 0} いいね</span>
              <span>🎮 ${g.play_count || 0} 回プレイ</span>
            </div>
          </div>
        </a>
      `).join('');
    }

    // 認証
    async function checkUser() {
      const { data: { user } } = await client.auth.getUser();
      currentUser = user;
      const statusDiv = document.getElementById('auth-status');
      if (user) {
        statusDiv.innerHTML = `
          <span class="text-xs text-indigo-300 font-bold">👤 ${user.email.split('@')[0]}</span>
          <button onclick="logout()" class="text-xs text-slate-400 hover:text-rose-400 ml-2">ログアウト</button>
        `;
      }
    }

    window.logout = async () => { await client.auth.signOut(); window.location.reload(); };

    let isSignUp = false;
    window.openAuthModal = () => document.getElementById('auth-modal').classList.remove('hidden');
    window.closeAuthModal = () => document.getElementById('auth-modal').classList.add('hidden');
    window.toggleAuthMode = () => {
      isSignUp = !isSignUp;
      document.getElementById('auth-title').innerText = isSignUp ? '新規登録' : 'ログイン';
      document.getElementById('auth-submit-btn').innerText = isSignUp ? '登録' : 'ログイン';
    };

    window.handleAuth = async () => {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      if (isSignUp) {
        const { error } = await client.auth.signUp({ email, password });
        if (error) alert(error.message);
        else { alert('登録完了！'); window.location.reload(); }
      } else {
        const { error } = await client.auth.signInWithPassword({ email, password });
        if (error) alert(error.message);
        else window.location.reload();
      }
    };

    // フレンド管理
    window.openFriendModal = async () => {
      if (!currentUser) return alert('フレンド機能を使うにはログインしてください！');
      document.getElementById('friend-modal').classList.remove('hidden');
      loadFriends();
    };
    window.closeFriendModal = () => document.getElementById('friend-modal').classList.add('hidden');

    async function loadFriends() {
      const { data: friends } = await client.from('friends').select('*').eq('user_email', currentUser.email);
      const list = document.getElementById('friends-list');
      if (!friends || friends.length === 0) return list.innerHTML = '<p class="text-slate-500 text-xs text-center">フレンドはまだいません。</p>';
      list.innerHTML = friends.map(f => `
        <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-700 flex justify-between items-center text-sm">
          <span>🟢 ${f.friend_email}</span>
          <span class="text-xs text-emerald-400">オンライン</span>
        </div>
      `).join('');
    }

    document.getElementById('friend-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const friend_email = document.getElementById('friend-email').value;
      if (friend_email === currentUser.email) return alert('自分自身は追加できません');
      await client.from('friends').insert({ user_email: currentUser.email, friend_email });
      alert('フレンドを追加しました！');
      document.getElementById('friend-email').value = '';
      loadFriends();
    });

    loadGames();
    checkUser();
  </script>
</body>
</html>
