<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ゲーム公開・AI生成 - G-HUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen flex justify-center items-center p-4">
  <div class="max-w-2xl w-full bg-[#111827] p-8 rounded-3xl border border-slate-800 shadow-2xl">
    <div class="flex justify-between items-center mb-6">
      <h1 id="page-title" class="text-2xl font-black bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">🚀 ゲームを公開する</h1>
      <a href="index.html" class="text-xs text-slate-400 hover:text-white">← トップへ戻る</a>
    </div>

    <!-- モード切り替えタブ -->
    <div class="flex gap-2 mb-6 border-b border-slate-800 pb-3">
      <button type="button" id="tab-ai" onclick="switchMode('ai')" class="px-4 py-2 font-bold text-xs rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-lg">🤖 G-AI 自動生成</button>
      <button type="button" id="tab-zip" onclick="switchMode('zip')" class="px-4 py-2 font-bold text-xs rounded-xl bg-slate-800 text-slate-400">📦 Zip投稿</button>
      <button type="button" id="tab-code" onclick="switchMode('code')" class="px-4 py-2 font-bold text-xs rounded-xl bg-slate-800 text-slate-400">⚡ コード直貼り</button>
    </div>

    <!-- G-AI 生成エリア -->
    <div id="ai-section" class="bg-purple-950/30 border border-purple-500/40 p-4 rounded-2xl mb-6">
      <label class="block text-xs font-bold text-purple-300 mb-1">🤖 どんなゲームを作りたいですか？</label>
      <div class="flex gap-2">
        <input type="text" id="ai-prompt" placeholder="例: スマホでも遊べる爽快タップクリッカーゲーム" class="flex-1 bg-slate-950 border border-purple-500/30 p-2.5 rounded-xl text-xs outline-none focus:border-purple-400 text-white">
        <button type="button" onclick="generateGameWithAI()" id="ai-gen-btn" class="bg-purple-600 hover:bg-purple-500 font-bold px-4 py-2.5 rounded-xl text-xs whitespace-nowrap shadow-lg">
          ゲーム生成！
        </button>
      </div>
      <p id="ai-status" class="text-[11px] text-purple-300 mt-2 font-mono"></p>
    </div>

    <form id="upload-form" class="space-y-4 text-xs">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-bold mb-1">ゲームタイトル</label>
          <input type="text" id="title" required placeholder="タイトルを入力" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block font-bold mb-1">ジャンルタグ</label>
          <select id="tag" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl outline-none focus:border-indigo-500 text-slate-200">
            <option value="Action">アクション</option>
            <option value="Puzzle">パズル</option>
            <option value="RPG">RPG</option>
            <option value="Horror">ホラー</option>
            <option value="Other">その他</option>
          </select>
        </div>
      </div>

      <!-- 対応機種の宣言 -->
      <div class="bg-slate-950/60 p-3.5 rounded-2xl border border-slate-800">
        <label class="block font-bold mb-2 text-indigo-300">🎮 対応機種をチェック</label>
        <div class="flex gap-4">
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="plat-pc" checked class="accent-indigo-600">
            <span>💻 PC (キーボード/マウス)</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="plat-mobile" class="accent-indigo-600">
            <span>📱 スマホ/タッチ対応</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="plat-pad" class="accent-indigo-600">
            <span>🎮 パッド対応</span>
          </label>
        </div>
      </div>

      <!-- お祭りエントリー -->
      <div class="bg-gradient-to-r from-amber-500/10 to-pink-500/10 p-3 rounded-2xl border border-amber-500/30 flex items-center justify-between">
        <div>
          <span class="font-bold text-amber-400 block">🎉 第1回 G-HUB杯（お祭り）</span>
          <span class="text-[10px] text-slate-400">お題：1分で遊べる神ゲー</span>
        </div>
        <label class="flex items-center gap-1.5 cursor-pointer bg-amber-500/20 px-3 py-1.5 rounded-xl border border-amber-500/40">
          <input type="checkbox" id="is-event" class="accent-amber-500">
          <span class="text-xs font-bold text-amber-300">エントリーする！</span>
        </label>
      </div>

      <div>
        <label class="block font-bold mb-1">説明・操作説明</label>
        <textarea id="desc" rows="2" placeholder="ゲームの説明や操作方法を入力" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl outline-none focus:border-indigo-500"></textarea>
      </div>

      <div id="zip-section" class="hidden">
        <label class="block font-bold mb-1">WebGLのZipファイル</label>
        <input type="file" id="file" accept=".zip" class="w-full text-slate-400 file:bg-slate-800 file:border-0 file:text-white file:px-3 file:py-1.5 file:rounded-xl file:mr-3 cursor-pointer">
      </div>

      <div id="code-section">
        <label class="block font-bold mb-1">ゲームコード (HTML / Canvas / JS)</label>
        <textarea id="code" rows="6" placeholder="HTMLコードまたはG-AIで自動生成されたコードがここに入ります" class="w-full font-mono text-[11px] bg-slate-950 border border-slate-700 p-3 rounded-xl outline-none text-emerald-400"></textarea>
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-90 font-bold p-3 rounded-xl transition shadow-lg mt-4 text-sm">
        ゲームを公開する！
      </button>
      <div id="status" class="text-center font-mono text-indigo-300 mt-2"></div>
    </form>
  </div>

  <script>
    const proxyUrl = window.location.origin + '/supabase';
    const supabase = window.supabase.createClient(proxyUrl, 'sb_publishable_cSX9rcWTjbX6lWfyT1KLNQ_tUFYuXtj');
    let currentMode = 'ai';

    async function checkAuth() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        alert('ゲームを投稿するにはログインが必要です！');
        window.location.href = 'index.html';
      }
    }
    checkAuth();

    window.switchMode = (mode) => {
      currentMode = mode;
      document.getElementById('ai-section').classList.toggle('hidden', mode !== 'ai');
      document.getElementById('zip-section').classList.toggle('hidden', mode !== 'zip');
      document.getElementById('code-section').classList.toggle('hidden', mode === 'zip');
      ['ai', 'zip', 'code'].forEach(m => {
        document.getElementById(`tab-${m}`).className = m === mode 
          ? 'px-4 py-2 font-bold text-xs rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-lg' 
          : 'px-4 py-2 font-bold text-xs rounded-xl bg-slate-800 text-slate-400';
      });
    };

    window.generateGameWithAI = async () => {
      const prompt = document.getElementById('ai-prompt').value;
      if (!prompt) return alert('どんなゲームにしたいか入力してください！');

      const btn = document.getElementById('ai-gen-btn');
      const status = document.getElementById('ai-status');
      btn.disabled = true;
      status.innerText = '🤖 Qwenがゲームのロジックと思考を組み立てています...(約10〜20秒)';

      try {
        const res = await fetch('/ai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemPrompt: 'You are an expert game developer. Create a complete, standalone, playable HTML5 Canvas + JavaScript game in a single file based on user request. Output ONLY valid raw HTML code without markdown code blocks, starting with <!DOCTYPE html> and ending with </html>.',
            userPrompt: prompt + ' 必ず画面内でちゃんと遊べてゲームオーバーやスコアがある完成品にしてください。',
            maxTokens: 2500
          })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        let cleanCode = data.reply.trim();
        if (cleanCode.startsWith('```html')) cleanCode = cleanCode.replace(/^```html/, '').replace(/```$/, '');
        else if (cleanCode.startsWith('```')) cleanCode = cleanCode.replace(/^```/, '').replace(/```$/, '');

        document.getElementById('code').value = cleanCode;
        document.getElementById('title').value = prompt.slice(0, 15) + ' (AI作)';
        document.getElementById('desc').value = `G-AI (Qwen 2.5 Coder) によって自動生成されたゲーム。\nお題: ${prompt}`;
        status.innerText = '✨ ゲームの生成が完了しました！';
      } catch (err) {
        status.innerText = '⚠️ エラー: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    };

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const tag = document.getElementById('tag').value;
      const desc = document.getElementById('desc').value;
      const isEvent = document.getElementById('is-event').checked;

      // 対応機種リストの組み立て
      const plats = [];
      if (document.getElementById('plat-pc').checked) plats.push('pc');
      if (document.getElementById('plat-mobile').checked) plats.push('mobile');
      if (document.getElementById('plat-pad').checked) plats.push('pad');

      const btn = document.getElementById('submit-btn');
      const status = document.getElementById('status');
      const gameId = crypto.randomUUID();
      const { data: { user } } = await supabase.auth.getUser();

      btn.disabled = true;

      try {
        let entryUrl = null;

        if (currentMode === 'zip') {
          const file = document.getElementById('file').files[0];
          if (!file) throw new Error('Zipを選択してください');
          const zip = new JSZip();
          const zipContent = await zip.loadAsync(file);
          let mainIndex = null;
          const files = Object.keys(zipContent.files).filter(k => !zipContent.files[k].dir);
          for (const f of files) {
            if (f.toLowerCase().endsWith('index.html')) {
              if (!mainIndex || f.split('/').length < mainIndex.split('/').length) mainIndex = f;
            }
          }
          for (const f of files) {
            const blob = await zipContent.files[f].async('blob');
            await supabase.storage.from('games').upload(`${gameId}/${f}`, blob, { upsert: true });
          }
          entryUrl = supabase.storage.from('games').getPublicUrl(`${gameId}/${mainIndex}`).data.publicUrl;
        } else {
          const rawCode = document.getElementById('code').value;
          if (!rawCode) throw new Error('ゲームコードを入力してください');
          const blob = new Blob([rawCode], { type: 'text/html' });
          await supabase.storage.from('games').upload(`${gameId}/index.html`, blob, { contentType: 'text/html', upsert: true });
          entryUrl = supabase.storage.from('games').getPublicUrl(`${gameId}/index.html`).data.publicUrl;
        }

        await supabase.from('games').insert({
          id: gameId,
          title,
          tag,
          description: desc,
          entry_url: entryUrl,
          author_email: user.email,
          platforms: plats.join(','),
          is_event: isEvent,
          likes_count: 0,
          play_count: 0
        });

        alert(isEvent ? '🎉 お祭りエントリー＆公開が完了しました！' : 'ゲームを公開しました！');
        window.location.href = `play.html?id=${gameId}`;
      } catch (err) {
        alert('エラー: ' + err.message);
        btn.disabled = false;
        status.innerText = '';
      }
    });
  </script>
</body>
</html>
