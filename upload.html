<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ゲーム投稿 - G-HUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex justify-center items-center p-4">
  <div class="max-w-md w-full bg-slate-800 p-6 rounded-xl border border-slate-700">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-indigo-400">ゲームを投稿</h1>
      <a href="index.html" class="text-sm text-slate-400 hover:text-white">← 戻る</a>
    </div>

    <form id="upload-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">ゲームタイトル</label>
        <input type="text" id="title" required class="w-full bg-slate-900 border border-slate-700 p-2 rounded focus:border-indigo-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">説明文</label>
        <textarea id="desc" class="w-full bg-slate-900 border border-slate-700 p-2 rounded focus:border-indigo-500 outline-none"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">ゲームのZipファイル (WebGLビルド一式)</label>
        <input type="file" id="file" accept=".zip" required class="w-full text-slate-400 file:bg-slate-700 file:border-0 file:text-white file:px-4 file:py-2 file:rounded file:mr-3">
        <p class="text-xs text-slate-400 mt-1">※ index.htmlを含むZipファイル</p>
      </div>
      <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold p-3 rounded-lg transition disabled:bg-slate-600">
        ゲームを公開する
      </button>
      <p id="status" class="text-center text-sm text-indigo-300 mt-2"></p>
    </form>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      'https://ddcnoghsiuxfhnwmtpyn.supabase.co',
      'sb_publishable_cSX9rcWTjbX6lWfyT1KLNQ_tUFYuXtj'
    );

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const desc = document.getElementById('desc').value;
      const file = document.getElementById('file').files[0];
      const btn = document.getElementById('submit-btn');
      const status = document.getElementById('status');

      if (!file || !title) return;

      btn.disabled = true;
      status.innerText = 'Zipファイルを解析中...';

      try {
        const zip = new JSZip();
        const zipContent = await zip.loadAsync(file);
        const gameId = crypto.randomUUID();
        let hasIndexHtml = false;

        const fileEntries = Object.keys(zipContent.files);
        let count = 0;

        for (const filename of fileEntries) {
          const zipEntry = zipContent.files[filename];
          if (zipEntry.dir) continue;

          if (filename.endsWith('index.html')) hasIndexHtml = true;

          status.innerText = `ファイルを転送中... (${++count}/${fileEntries.length})`;
          
          const blob = await zipEntry.async('blob');
          const filePath = `${gameId}/${filename}`;

          const { error } = await supabase.storage.from('games').upload(filePath, blob, {
            contentType: filename.endsWith('.html') ? 'text/html' : 
                         filename.endsWith('.js') ? 'application/javascript' : 
                         filename.endsWith('.wasm') ? 'application/wasm' : undefined,
            upsert: true
          });

          if (error) throw error;
        }

        if (!hasIndexHtml) throw new Error('Zip内に index.html が見つかりませんでした。');

        const { data: { publicUrl } } = supabase.storage.from('games').getPublicUrl(`${gameId}/index.html`);

        status.innerText = '登録中...';
        const { error: dbError } = await supabase.from('games').insert({
          id: gameId,
          title,
          description: desc,
          entry_url: publicUrl,
        });

        if (dbError) throw dbError;

        alert('ゲームの公開が完了しました！');
        window.location.href = `play.html?id=${gameId}`;
      } catch (err) {
        alert('エラー: ' + err.message);
        btn.disabled = false;
        status.innerText = '';
      }
    });
  </script>
</body>
</html>
