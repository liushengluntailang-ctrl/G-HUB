<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ゲーム投稿 - G-HUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex justify-center items-center p-4">
  <div class="max-w-md w-full bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-2xl">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-indigo-400">ゲームを公開</h1>
      <a href="index.html" class="text-sm text-slate-400 hover:text-white">← 一覧へ戻る</a>
    </div>

    <form id="upload-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">ゲームタイトル</label>
        <input type="text" id="title" required placeholder="例: 超爽快シューティング" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg focus:border-indigo-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">説明文・操作方法</label>
        <textarea id="desc" rows="3" placeholder="矢印キーで移動、Spaceでジャンプ！" class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-lg focus:border-indigo-500 outline-none"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">ゲームZipファイル (WebGLビルド一式)</label>
        <input type="file" id="file" accept=".zip" required class="w-full text-slate-400 file:bg-slate-700 file:border-0 file:text-white file:px-4 file:py-2 file:rounded file:mr-3 cursor-pointer">
        <p class="text-xs text-indigo-300 mt-1.5">※ UnityなどのフォルダごとZip圧縮したものでも自動認識します</p>
      </div>
      <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold p-3 rounded-lg transition disabled:bg-slate-700">
        ゲームをアップロード
      </button>
      <div id="status" class="text-center text-sm text-indigo-300 font-mono mt-2"></div>
    </form>
  </div>

  <script>
    const proxyUrl = window.location.origin + '/supabase';
    const supabase = window.supabase.createClient(proxyUrl, 'sb_publishable_cSX9rcWTjbX6lWfyT1KLNQ_tUFYuXtj');

    function getMimeType(filename) {
      if (filename.endsWith('.html')) return 'text/html';
      if (filename.endsWith('.js')) return 'application/javascript';
      if (filename.endsWith('.css')) return 'text/css';
      if (filename.endsWith('.wasm')) return 'application/wasm';
      if (filename.endsWith('.json')) return 'application/json';
      if (filename.endsWith('.png')) return 'image/png';
      if (filename.endsWith('.jpg') || filename.endsWith('.jpeg')) return 'image/jpeg';
      return 'application/octet-stream';
    }

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const desc = document.getElementById('desc').value;
      const file = document.getElementById('file').files[0];
      const btn = document.getElementById('submit-btn');
      const status = document.getElementById('status');

      if (!file || !title) return;

      btn.disabled = true;
      status.innerText = 'Zipファイルを解凍・分析中...';

      try {
        const zip = new JSZip();
        const zipContent = await zip.loadAsync(file);
        const gameId = crypto.randomUUID();
        let mainIndexPath = null;

        const fileEntries = Object.keys(zipContent.files).filter(name => !zipContent.files[name].dir);

        // 最適な index.html を自動検出（一番階層が浅いものを優先）
        for (const filename of fileEntries) {
          if (filename.toLowerCase().endsWith('index.html')) {
            if (!mainIndexPath || filename.split('/').length < mainIndexPath.split('/').length) {
              mainIndexPath = filename;
            }
          }
        }

        if (!mainIndexPath) {
          throw new Error('Zip内に index.html が見つかりませんでした。ビルドファイルを確認してください。');
        }

        let count = 0;
        for (const filename of fileEntries) {
          const zipEntry = zipContent.files[filename];
          count++;
          status.innerText = `転送中: (${count}/${fileEntries.length}) ${filename.split('/').pop()}`;

          const blob = await zipEntry.async('blob');
          const filePath = `${gameId}/${filename}`;

          const { error } = await supabase.storage.from('games').upload(filePath, blob, {
            contentType: getMimeType(filename),
            upsert: true
          });

          if (error) throw error;
        }

        const { data: { publicUrl } } = supabase.storage.from('games').getPublicUrl(`${gameId}/${mainIndexPath}`);

        status.innerText = 'ゲーム情報を登録中...';
        const { error: dbError } = await supabase.from('games').insert({
          id: gameId,
          title,
          description: desc,
          entry_url: publicUrl,
        });

        if (dbError) throw dbError;

        alert('ゲームの公開が完了しました！');
        window.location.href = `play.html?id=${gameId}`;
      } catch (err) {
        alert('アップロード失敗: ' + err.message);
        btn.disabled = false;
        status.innerText = '';
      }
    });
  </script>
</body>
</html>
