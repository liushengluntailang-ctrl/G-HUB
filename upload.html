<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ゲームビルダー - G-HUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <!-- esbuild-wasm バンドルエンジン -->
  <script src="https://cdn.jsdelivr.net/npm/esbuild-wasm@0.19.11/lib/browser.min.js"></script>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen p-4 flex justify-center items-center font-sans">
  <div class="max-w-5xl w-full bg-[#111827] p-6 lg:p-8 rounded-3xl border border-slate-800 shadow-2xl">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-black bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">
          🚀 ゲームビルダー ＆ プレビュー
        </h1>
        <p class="text-xs text-slate-400">Vite / React / TSX ＆ 通常HTML Zip ＆ AI生成に完全対応</p>
      </div>
      <div class="flex gap-2">
        <button type="button" onclick="loadSampleGame()" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black px-3 py-1.5 rounded-xl text-xs shadow transition">
          🧪 サンプルゲーム読込
        </button>
        <a href="index.html" class="text-xs text-slate-400 hover:text-white px-2 py-1.5">← トップへ</a>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- 左側: アップロード ＆ 設定 -->
      <div class="space-y-4">
        <!-- モード切り替えタブ -->
        <div class="flex gap-2 border-b border-slate-800 pb-3">
          <button type="button" id="tab-zip" onclick="switchMode('zip')" class="px-3 py-1.5 font-bold text-xs rounded-xl bg-indigo-600 text-white">📦 Zip (Vite/TSX/HTML)</button>
          <button type="button" id="tab-ai" onclick="switchMode('ai')" class="px-3 py-1.5 font-bold text-xs rounded-xl bg-slate-800 text-slate-400">🤖 AI自動生成</button>
          <button type="button" id="tab-code" onclick="switchMode('code')" class="px-3 py-1.5 font-bold text-xs rounded-xl bg-slate-800 text-slate-400">⚡ コード直貼り</button>
        </div>

        <!-- AIモード -->
        <div id="ai-section" class="hidden bg-purple-950/30 border border-purple-500/40 p-3 rounded-2xl">
          <label class="block text-xs font-bold text-purple-300 mb-1">🤖 どんなゲームを作りたいですか？</label>
          <div class="flex gap-2">
            <input type="text" id="ai-prompt" placeholder="例: スペースキーでジャンプして障害物を避けるゲーム" class="flex-1 bg-slate-950 border border-purple-500/30 p-2 rounded-xl text-xs outline-none text-white">
            <button type="button" onclick="generateWithAI()" id="ai-gen-btn" class="bg-purple-600 hover:bg-purple-500 font-bold px-3 py-2 rounded-xl text-xs whitespace-nowrap shadow">生成</button>
          </div>
        </div>

        <!-- Zipドロップゾーン -->
        <div id="zip-section">
          <div id="drop-zone" onclick="document.getElementById('file-input').click()" class="border-2 border-dashed border-slate-700 hover:border-indigo-500 bg-slate-950/60 p-6 rounded-2xl text-center cursor-pointer transition">
            <p class="text-xs font-bold text-slate-300">📁 ここにZipファイルをドロップ</p>
            <p class="text-[10px] text-slate-500 mt-1">Vite/React/TSX または HTML5ゲームZipをクリックして選択</p>
            <input type="file" id="file-input" accept=".zip" class="hidden">
          </div>
        </div>

        <!-- コード直貼り -->
        <div id="code-section" class="hidden">
          <label class="block text-xs font-bold mb-1">HTML / Canvas コード</label>
          <textarea id="code-input" rows="5" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl text-xs font-mono text-emerald-400 outline-none"></textarea>
          <button type="button" onclick="previewDirectCode()" class="mt-1 bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1 rounded-lg">プレビューに反映</button>
        </div>

        <!-- 設定入力 -->
        <div class="space-y-3 pt-2 text-xs">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block font-bold mb-1">タイトル</label>
              <input type="text" id="title" required placeholder="ゲーム名" class="w-full bg-slate-950 border border-slate-700 p-2 rounded-xl outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="block font-bold mb-1">ジャンル</label>
              <select id="tag" class="w-full bg-slate-950 border border-slate-700 p-2 rounded-xl outline-none text-slate-200">
                <option value="Action">アクション</option>
                <option value="Puzzle">パズル</option>
                <option value="RPG">RPG</option>
                <option value="Horror">ホラー</option>
                <option value="Other">その他</option>
              </select>
            </div>
          </div>

          <!-- 価格設定 -->
          <div class="bg-gradient-to-r from-amber-500/10 to-indigo-500/10 p-3 rounded-2xl border border-amber-500/30 flex items-center justify-between">
            <div>
              <span class="font-bold text-amber-400 block">💎 販売価格</span>
              <span class="text-[10px] text-slate-400">有料にすると購入者だけがプレイ可能</span>
            </div>
            <select id="price" class="bg-slate-950 border border-amber-500/50 text-amber-300 font-bold px-3 py-1.5 rounded-xl outline-none">
              <option value="0">🆓 無料 (Free)</option>
              <option value="30">💎 30 G</option>
              <option value="50">💎 50 G</option>
              <option value="100">💎 100 G</option>
            </select>
          </div>

          <!-- 対応機種 -->
          <div class="bg-slate-950/40 p-2.5 rounded-xl border border-slate-800 flex gap-4 text-xs font-bold">
            <label class="cursor-pointer"><input type="checkbox" id="plat-pc" checked class="accent-indigo-600"> 💻 PC</label>
            <label class="cursor-pointer"><input type="checkbox" id="plat-mobile" class="accent-indigo-600"> 📱 スマホ</label>
            <label class="cursor-pointer"><input type="checkbox" id="plat-pad" class="accent-indigo-600"> 🎮 パッド</label>
          </div>

          <div>
            <label class="block font-bold mb-1">説明文</label>
            <textarea id="desc" rows="2" placeholder="ゲームの説明や操作方法を入力" class="w-full bg-slate-950 border border-slate-700 p-2 rounded-xl outline-none focus:border-indigo-500"></textarea>
          </div>

          <!-- ターミナルログ画面 -->
          <div id="terminal" class="bg-black text-[#4af626] font-mono text-[10px] p-2.5 rounded-xl h-24 overflow-y-auto border border-slate-800 whitespace-pre-wrap">--- ログ ---<br></div>

          <button type="button" onclick="publishGame()" id="publish-btn" class="w-full bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-90 font-bold p-3 rounded-xl transition shadow-lg text-xs">
            🚀 このゲームをG-HUBに公開する！
          </button>
        </div>
      </div>

      <!-- 右側: ライブプレビュー画面 -->
      <div class="flex flex-col h-[520px] bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden">
        <div class="bg-slate-900 px-4 py-2 border-b border-slate-800 flex justify-between items-center text-xs">
          <span class="font-bold text-slate-300 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 動作確認プレビュー
          </span>
          <button type="button" onclick="clearSaveData()" class="text-rose-400 hover:text-rose-300 font-bold text-[11px]">
            🗑️ セーブ消去＆リセット
          </button>
        </div>
        <div class="flex-1 bg-black relative">
          <iframe id="preview-iframe" class="w-full h-full border-0 bg-white" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-modals"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script>
    const proxyUrl = window.location.origin + '/supabase';
    const supabase = window.supabase.createClient(proxyUrl, 'sb_publishable_cSX9rcWTjbX6lWfyT1KLNQ_tUFYuXtj');

    const terminal = document.getElementById('terminal');
    const iframe = document.getElementById('preview-iframe');
    let esbuildReady = false;
    let finalHtmlContent = null;
    let currentMode = 'zip';

    function log(msg) {
      terminal.innerText += msg + '\n';
      terminal.scrollTop = terminal.scrollHeight;
    }

    // iframe内のエラーメッセージを親画面のターミナルに中継
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'error') {
        log(`❌ [プレビュー内エラー] ${e.data.msg}`);
      }
    });

    // 1. esbuild-wasm の初期化
    async function initEsbuild() {
      try {
        await esbuild.initialize({ wasmURL: 'https://cdn.jsdelivr.net/npm/esbuild-wasm@0.19.11/esbuild.wasm' });
        esbuildReady = true;
        log('✅ esbuild-wasm バンドルエンジン準備完了！');
      } catch (e) {
        log('⚠️ esbuild 初期化スキップ (静的HTMLモードで動作可): ' + e.message);
      }
    }
    initEsbuild();

    // 2. モード切り替え
    window.switchMode = (mode) => {
      currentMode = mode;
      document.getElementById('ai-section').classList.toggle('hidden', mode !== 'ai');
      document.getElementById('zip-section').classList.toggle('hidden', mode !== 'zip');
      document.getElementById('code-section').classList.toggle('hidden', mode !== 'code');
      ['zip', 'ai', 'code'].forEach(m => {
        document.getElementById(`tab-${m}`).className = m === mode ? 'px-3 py-1.5 font-bold text-xs rounded-xl bg-indigo-600 text-white' : 'px-3 py-1.5 font-bold text-xs rounded-xl bg-slate-800 text-slate-400';
      });
    };

    // 3. Zip処理 ＆ 相対パス完全インライン化バンドラー
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    dropZone.addEventListener('dragover', (e) => e.preventDefault());
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    async function handleFile(file) {
      document.getElementById('title').value = file.name.replace('.zip', '');
      log(`\n📦 Zipファイルを解析中: ${file.name}`);

      try {
        const zip = await JSZip.loadAsync(file);
        const files = {};
        const paths = Object.keys(zip.files);

        // フォルダ階層の自動トリム
        let prefix = '';
        const rootFolders = new Set(paths.map(p => p.split('/')[0]).filter(Boolean));
        if (rootFolders.size === 1 && paths.some(p => p.endsWith('index.html'))) prefix = Array.from(rootFolders)[0] + '/';

        for (const [path, entry] of Object.entries(zip.files)) {
          if (entry.dir) continue;
          let cleanPath = prefix && path.startsWith(prefix) ? path.slice(prefix.length) : path;
          files[cleanPath] = await entry.async('text');
        }

        let html = files['index.html'] || files['public/index.html'];
        if (!html) throw new Error('index.html が見つかりませんでした。');

        const entryCandidates = ['src/main.tsx', 'src/main.jsx', 'src/index.tsx', 'src/index.jsx', 'src/App.tsx', 'src/App.jsx'];
        const entryPath = entryCandidates.find(e => files[e] !== undefined);

        // パターンA: Vite / React / TSX プロジェクトの場合 (esbuildで完全バンドル)
        if (entryPath && esbuildReady) {
          log(`⚡ Vite/React TSX エントリポイント検出: ${entryPath}`);
          log('⚡ esbuild によるインメモリ・バンドル処理中...');

          const zipPlugin = {
            name: 'zip-vfs',
            setup(build) {
              build.onResolve({ filter: /.*/ }, args => {
                let target = args.path.startsWith('/') ? args.path.slice(1) : args.path;
                const isRelative = args.path.startsWith('.');
                const isAbsoluteLocal = files[target] !== undefined;

                if (isRelative || isAbsoluteLocal || args.kind === 'entry-point') {
                  if (args.importer) {
                    const basePath = args.importer.split('/').slice(0, -1).join('/');
                    const rawPath = basePath ? basePath + '/' + args.path : args.path;
                    const parts = rawPath.split('/');
                    const stack = [];
                    for (const p of parts) {
                      if (p === '.' || p === '') continue;
                      if (p === '..') stack.pop(); else stack.push(p);
                    }
                    target = stack.join('/');
                  }
                  const exts = ['', '.tsx', '.ts', '.jsx', '.js', '.css', '/index.tsx', '/index.ts', '/index.jsx', '/index.js'];
                  for (const ext of exts) {
                    if (files[target + ext] !== undefined) return { path: target + ext, namespace: 'zip-vfs' };
                  }
                  return { path: target, namespace: 'zip-vfs' };
                }
                return { path: `https://esm.sh/${args.path}`, external: true };
              });

              build.onLoad({ filter: /.*/, namespace: 'zip-vfs' }, args => {
                const content = files[args.path];
                if (content === undefined) return { errors: [{ text: `File not found in zip: ${args.path}` }] };

                if (args.path.endsWith('.css')) {
                  return { contents: `const s=document.createElement('style');s.textContent=${JSON.stringify(content)};document.head.appendChild(s);`, loader: 'js' };
                }
                let loader = args.path.endsWith('.tsx') ? 'tsx' : args.path.endsWith('.ts') ? 'ts' : args.path.endsWith('.jsx') ? 'jsx' : 'js';
                return { contents: content, loader };
              });
            }
          };

          const result = await esbuild.build({
            entryPoints: [entryPath],
            bundle: true,
            format: 'esm',
            plugins: [zipPlugin],
            write: false,
            jsx: 'automatic',
            jsxImportSource: 'react'
          });

          const parser = new DOMParser();
          const doc = parser.parseFromString(html || '<div id="root"></div>', 'text/html');

          // Tailwind CSS 注入
          const tw = doc.createElement('script');
          tw.src = 'https://cdn.tailwindcss.com';
          doc.head.appendChild(tw);

          // エラー検知スクリプト注入
          injectErrorHandler(doc);

          // バンドル済みJS注入
          const scriptEl = doc.createElement('script');
          scriptEl.type = 'module';
          scriptEl.textContent = result.outputFiles[0].text;
          doc.querySelectorAll('script[type="module"]').forEach(s => s.remove());
          doc.body.appendChild(scriptEl);

          finalHtmlContent = doc.documentElement.outerHTML;
          iframe.srcdoc = finalHtmlContent;
          log('🎉 TSXバンドル大成功！プレビューで遊べます！');

        } else {
          // パターンB: 通常の HTML + JS + CSS Zip (相対パスを完全インライン結合)
          log('🔍 静的HTMLゲームを検出。相対パスのJS・CSSを結合中...');
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');

          // CSSファイルのインライン化
          doc.querySelectorAll('link[rel="stylesheet"]').forEach(link => {
            const href = link.getAttribute('href');
            if (href && files[href]) {
              const style = doc.createElement('style');
              style.textContent = files[href];
              link.replaceWith(style);
            }
          });

          // JSファイルのインライン化
          doc.querySelectorAll('script[src]').forEach(script => {
            const src = script.getAttribute('src');
            if (src && files[src]) {
              const inlineScript = doc.createElement('script');
              if (script.type) inlineScript.type = script.type;
              inlineScript.textContent = files[src];
              script.replaceWith(inlineScript);
            }
          });

          injectErrorHandler(doc);

          finalHtmlContent = doc.documentElement.outerHTML;
          iframe.srcdoc = finalHtmlContent;
          log('🎉 プレビュー描画完了！右側でゲームが動きます！');
        }
      } catch (err) {
        log(`❌ 解析・バンドルエラー: ${err.message}`);
      }
    }

    function injectErrorHandler(doc) {
      const errScript = doc.createElement('script');
      errScript.textContent = `
        window.onerror = function(msg, url, line) {
          window.parent.postMessage({ type: 'error', msg: msg + ' (行: ' + line + ')' }, '*');
        };
      `;
      doc.head.appendChild(errScript);
    }

    // 4. セーブデータ消去
    window.clearSaveData = () => {
      try {
        iframe.contentWindow.localStorage.clear();
        iframe.contentWindow.sessionStorage.clear();
        const cur = iframe.srcdoc;
        iframe.srcdoc = '';
        setTimeout(() => iframe.srcdoc = cur, 50);
        log('🗑️ セーブデータを消去してプレビューをリセットしました。');
      } catch (e) {
        log('❌ セーブ消去失敗: ' + e.message);
      }
    };

    // 5. 【救済】サンプル神ゲーの即時読み込み（1秒で遊べる！）
    window.loadSampleGame = () => {
      log('\n🧪 サンプルゲーム（超爽快！ネオン・シューター）を生成中...');
      const sampleCode = `
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Neon Shooter</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#05050a; color:#fff; overflow:hidden; font-family:sans-serif; text-align:center; }
    canvas { background:#0a0a14; display:block; margin:0 auto; border:2px solid #6366f1; }
    #ui { position:absolute; top:10px; left:10px; font-weight:bold; font-size:16px; color:#4af626; }
  </style>
</head>
<body>
  <div id="ui">SCORE: <span id="score">0</span></div>
  <canvas id="c" width="480" height="320"></canvas>
  <script>
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    let x = 220, bullets = [], enemies = [], score = 0, keys = {};
    window.onkeydown = e => keys[e.key] = true;
    window.onkeyup = e => keys[e.key] = false;

    setInterval(() => {
      if (Math.random() < 0.6) enemies.push({ x: Math.random() * 440, y: 0, s: 2 + Math.random()*2 });
    }, 600);

    let lastShot = 0;
    function loop() {
      if (keys['ArrowLeft'] && x > 0) x -= 6;
      if (keys['ArrowRight'] && x < 440) x += 6;
      if (keys[' '] && Date.now() - lastShot > 150) {
        bullets.push({ x: x + 18, y: 280 });
        lastShot = Date.now();
      }

      ctx.fillStyle = '#0a0a14'; ctx.fillRect(0,0,c.width,c.height);
      ctx.fillStyle = '#6366f1'; ctx.fillRect(x, 290, 40, 15);

      ctx.fillStyle = '#f43f5e';
      bullets.forEach((b, bi) => {
        b.y -= 8; ctx.fillRect(b.x, b.y, 4, 10);
        if (b.y < 0) bullets.splice(bi, 1);
      });

      enemies.forEach((e, ei) => {
        e.y += e.s;
        ctx.fillStyle = '#38bdf8'; ctx.fillRect(e.x, e.y, 25, 20);

        bullets.forEach((b, bi) => {
          if (b.x > e.x && b.x < e.x+25 && b.y > e.y && b.y < e.y+20) {
            enemies.splice(ei, 1); bullets.splice(bi, 1);
            score += 100;
            document.getElementById('score').innerText = score;
          }
        });

        if (e.y > 320) enemies.splice(ei, 1);
      });

      requestAnimationFrame(loop);
    }
    loop();
  <\/script>
</body>
</html>
      `.trim();

      finalHtmlContent = sampleCode;
      iframe.srcdoc = sampleCode;
      document.getElementById('title').value = 'ネオン・シューター (サンプル)';
      document.getElementById('desc').value = '左右キーで移動、Spaceキーでビーム発射！敵を撃破してハイスコアを目指せ！';
      log('🎉 サンプルゲームの読み込み完了！右側をクリックしてSpaceキーで撃てます！');
    };

    window.previewDirectCode = () => {
      finalHtmlContent = document.getElementById('code-input').value;
      iframe.srcdoc = finalHtmlContent;
      log('プレビューを更新しました。');
    };

    // 6. G-AI 自動生成
    window.generateWithAI = async () => {
      const prompt = document.getElementById('ai-prompt').value;
      if (!prompt) return alert('作りたいゲームの内容を入力してください！');
      const btn = document.getElementById('ai-gen-btn');
      btn.disabled = true;
      log('\n🤖 Qwen 2.5 Coder がゲームをコーディング中...');

      try {
        const res = await fetch('/ai', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemPrompt: 'You are an expert game developer. Create a complete, standalone, playable HTML5 Canvas + JavaScript game in a single file based on user request. Output ONLY valid raw HTML code without markdown code blocks.',
            userPrompt: prompt,
            maxTokens: 2500
          })
        });
        const data = await res.json();
        let code = data.reply.trim().replace(/^```html/, '').replace(/```$/, '');
        finalHtmlContent = code;
        document.getElementById('code-input').value = code;
        document.getElementById('title').value = prompt.slice(0, 15) + ' (AI作)';
        iframe.srcdoc = code;
        log('✨ AIゲーム生成完了！右側ですぐに遊べます！');
      } catch (e) {
        log('❌ エラー: ' + e.message);
      } finally {
        btn.disabled = false;
      }
    };

    // 7. G-HUB への本番公開
    window.publishGame = async () => {
      const title = document.getElementById('title').value;
      const tag = document.getElementById('tag').value;
      const desc = document.getElementById('desc').value;
      const price = parseInt(document.getElementById('price').value);
      const btn = document.getElementById('publish-btn');

      if (!title) return alert('タイトルを入力してください！');
      if (!finalHtmlContent) return alert('ゲームが読み込まれていません！Zipを入れるかサンプルを読み込んでください。');

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return alert('公開するにはログインが必要です！');

      btn.disabled = true;
      log('\n🚀 G-HUBにゲームをアップロード中...');

      try {
        const gameId = crypto.randomUUID();
        const blob = new Blob([finalHtmlContent], { type: 'text/html' });
        await supabase.storage.from('games').upload(`${gameId}/index.html`, blob, { contentType: 'text/html' });
        const entryUrl = supabase.storage.from('games').getPublicUrl(`${gameId}/index.html`).data.publicUrl;

        const plats = [];
        if (document.getElementById('plat-pc').checked) plats.push('pc');
        if (document.getElementById('plat-mobile').checked) plats.push('mobile');
        if (document.getElementById('plat-pad').checked) plats.push('pad');

        await supabase.from('games').insert({
          id: gameId,
          title,
          tag,
          description: desc,
          entry_url: entryUrl,
          author_email: user.email,
          platforms: plats.join(','),
          price_coins: price,
          likes_count: 0,
          play_count: 0
        });

        log('🎉 公開大成功！プレイ画面へ移動します...');
        alert('ゲームの公開が完了しました！');
        window.location.href = `play.html?id=${gameId}`;
      } catch (err) {
        log('❌ 公開失敗: ' + err.message);
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
