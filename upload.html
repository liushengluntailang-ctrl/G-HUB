<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ゲーム公開・更新 - G-HUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen flex justify-center items-center p-4">
  <div class="max-w-xl w-full bg-[#111827] p-8 rounded-3xl border border-slate-800 shadow-2xl">
    <div class="flex justify-between items-center mb-6">
      <h1 id="page-title" class="text-2xl font-black bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent">🚀 ゲームを公開する</h1>
      <a href="index.html" class="text-xs text-slate-400 hover:text-white">← トップへ戻る</a>
    </div>

    <!-- 投稿モード切り替えタブ -->
    <div class="flex gap-2 mb-6 border-b border-slate-800 pb-3">
      <button type="button" id="tab-zip" onclick="switchMode('zip')" class="px-4 py-2 font-bold text-xs rounded-xl bg-indigo-600 text-white">📦 Zipファイル</button>
      <button type="button" id="tab-code" onclick="switchMode('code')" class="px-4 py-2 font-bold text-xs rounded-xl bg-slate-800 text-slate-400">⚡ TSX/HTML直書き</button>
    </div>

    <form id="upload-form" class="space-y-4 text-xs">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-bold mb-1">ゲームタイトル</label>
          <input type="text" id="title" required placeholder="タイトルを入力" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block font-bold mb-1">ジャンルタグ</label>
          <select id="tag" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl outline-none focus:border-indigo-500 text-slate-200">
            <option value="Action">アクション</option>
            <option value="Puzzle">パズル</option>
            <option value="RPG">RPG</option>
            <option value="Horror">ホラー</option>
            <option value="Other">その他</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block font-bold mb-1">サムネイル画像 (PNG / JPG)</label>
        <input type="file" id="thumb" accept="image/*" class="w-full text-slate-400 file:bg-slate-800 file:border-0 file:text-white file:px-3 file:py-1.5 file:rounded-xl file:mr-3 cursor-pointer">
      </div>

      <div>
        <label class="block font-bold mb-1">説明・操作説明</label>
        <textarea id="desc" rows="2" placeholder="ゲームの説明や遊び方を入力" class="w-full bg-slate-950 border border-slate-700 p-2.5 rounded-xl outline-none focus:border-indigo-500"></textarea>
      </div>

      <div id="zip-section">
        <label class="block font-bold mb-1">WebGLのZipファイル</label>
        <input type="file" id="file" accept=".zip" class="w-full text-slate-400 file:bg-slate-800 file:border-0 file:text-white file:px-3 file:py-1.5 file:rounded-xl file:mr-3 cursor-pointer">
      </div>

      <div id="code-section" class="hidden">
        <label class="block font-bold mb-1">コード (TSX / JavaScript / HTML)</label>
        <textarea id="code" rows="5" placeholder="<h1>Game</h1><script>...</script>" class="w-full font-mono text-[11px] bg-slate-950 border border-slate-700 p-3 rounded-xl outline-none text-emerald-400"></textarea>
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-indigo-600 to-pink-600 hover:opacity-90 font-bold p-3 rounded-xl transition shadow-lg mt-4 text-sm">
        ゲームを公開する！
      </button>
      <div id="status" class="text-center font-mono text-indigo-300 mt-2"></div>
    </form>
  </div>

  <script>
    const proxyUrl = window.location.origin + '/supabase';
    const supabase = window.supabase.createClient(proxyUrl, 'sb_publishable_cSX9rcWTjbX6lWfyT1KLNQ_tUFYuXtj');
    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('edit');
    let currentMode = 'zip';

    // ログインガード
    async function checkAuth() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        alert('ゲームを投稿・更新するにはログインが必要です！');
        window.location.href = 'index.html';
      }
    }
    checkAuth();

    window.switchMode = (mode) => {
      currentMode = mode;
      document.getElementById('zip-section').classList.toggle('hidden', mode !== 'zip');
      document.getElementById('code-section').classList.toggle('hidden', mode !== 'code');
      document.getElementById('tab-zip').className = mode === 'zip' ? 'px-4 py-2 font-bold text-xs rounded-xl bg-indigo-600 text-white' : 'px-4 py-2 font-bold text-xs rounded-xl bg-slate-800 text-slate-400';
      document.getElementById('tab-code').className = mode === 'code' ? 'px-4 py-2 font-bold text-xs rounded-xl bg-indigo-600 text-white' : 'px-4 py-2 font-bold text-xs rounded-xl bg-slate-800 text-slate-400';
    };

    document.getElementById('upload-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const tag = document.getElementById('tag').value;
      const desc = document.getElementById('desc').value;
      const thumbFile = document.getElementById('thumb').files[0];
      const btn = document.getElementById('submit-btn');
      const status = document.getElementById('status');
      const gameId = editId || crypto.randomUUID();

      const { data: { user } } = await supabase.auth.getUser();
      btn.disabled = true;

      try {
        let entryUrl = null;
        let thumbUrl = null;

        // サムネイル画像のアップロード
        if (thumbFile) {
          status.innerText = 'サムネイル画像をアップロード中...';
          const ext = thumbFile.name.split('.').pop();
          const thumbPath = `${gameId}/thumbnail.${ext}`;
          await supabase.storage.from('games').upload(thumbPath, thumbFile, { upsert: true });
          thumbUrl = supabase.storage.from('games').getPublicUrl(thumbPath).data.publicUrl;
        }

        // コード直接入力
        if (currentMode === 'code') {
          const rawCode = document.getElementById('code').value;
          if (rawCode) {
            status.innerText = 'コード変換中...';
            const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><script src="https://cdn.tailwindcss.com"><\/script><script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script></head><body class="bg-black text-white min-h-screen flex items-center justify-center m-0"><div id="root"></div><script type="text/babel">${rawCode}<\/script></body></html>`;
            const blob = new Blob([html], { type: 'text/html' });
            await supabase.storage.from('games').upload(`${gameId}/index.html`, blob, { contentType: 'text/html', upsert: true });
            entryUrl = supabase.storage.from('games').getPublicUrl(`${gameId}/index.html`).data.publicUrl;
          }
        } else {
          // Zipアップロード
          const file = document.getElementById('file').files[0];
          if (file) {
            status.innerText = 'Zip解析中...';
            const zip = new JSZip();
            const zipContent = await zip.loadAsync(file);
            let mainIndex = null;
            const files = Object.keys(zipContent.files).filter(k => !zipContent.files[k].dir);

            for (const f of files) {
              if (f.toLowerCase().endsWith('index.html')) {
                if (!mainIndex || f.split('/').length < mainIndex.split('/').length) mainIndex = f;
              }
            }
            if (!mainIndex) throw new Error('Zip内に index.html がありません');

            let c = 0;
            for (const f of files) {
              status.innerText = `転送中: (${++c}/${files.length})`;
              const blob = await zipContent.files[f].async('blob');
              await supabase.storage.from('games').upload(`${gameId}/${f}`, blob, { upsert: true });
            }
            entryUrl = supabase.storage.from('games').getPublicUrl(`${gameId}/${mainIndex}`).data.publicUrl;
          }
        }

        if (editId) {
          const updateData = { title, description: desc, tag };
          if (entryUrl) updateData.entry_url = entryUrl;
          if (thumbUrl) updateData.thumbnail_url = thumbUrl;
          await supabase.from('games').update(updateData).eq('id', editId);
          alert('アップデート完了！');
        } else {
          if (!entryUrl) throw new Error('ゲームファイルまたはコードを入力してください');
          await supabase.from('games').insert({
            id: gameId,
            title,
            tag,
            description: desc,
            entry_url: entryUrl,
            thumbnail_url: thumbUrl,
            author_email: user.email,
            likes_count: 0,
            play_count: 0
          });

          // 開発者EXP付与 (+100 EXP)
          const { data: prof } = await supabase.from('profiles').select('*').eq('email', user.email).single();
          if (prof) {
            const newExp = (prof.dev_exp || 0) + 100;
            await supabase.from('profiles').update({ dev_exp: newExp, dev_level: Math.floor(newExp / 100) + 1 }).eq('email', user.email);
          }
          alert('ゲームを公開しました！（開発者EXP +100獲得！）');
        }

        window.location.href = `play.html?id=${gameId}`;
      } catch (err) {
        alert('エラー: ' + err.message);
        btn.disabled = false;
        status.innerText = '';
      }
    });
  </script>
</body>
</html>
