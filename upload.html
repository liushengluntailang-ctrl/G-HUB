<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G-HUB - Zip Runner & Publisher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; display: flex; height: 100vh; background: #1e1e1e; color: #fff; }
    #sidebar { width: 380px; border-right: 1px solid #333; display: flex; flex-direction: column; padding: 16px; gap: 10px; background: #252526; overflow-y: auto; }
    #main { flex: 1; display: flex; flex-direction: column; background: #1e1e1e; position: relative; }
    #drop-zone { border: 2px dashed #444; border-radius: 8px; padding: 20px 12px; text-align: center; background: #2d2d2d; cursor: pointer; }
    #drop-zone:hover { border-color: #646cff; background: #333342; }
    #file-input { display: none; }
    #status { font-size: 11px; padding: 6px 10px; border-radius: 4px; background: #2e7d32; text-align: center; font-weight: bold; }
    #terminal { height: 120px; background: #0e0e0e; color: #4af626; font-family: monospace; font-size: 11px; padding: 10px; overflow-y: auto; white-space: pre-wrap; border-radius: 6px; border: 1px solid #333; }
    #iframe-header { height: 40px; background: #2d2d2d; border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 12px; color: #ccc; }
    
    .btn-group { display: flex; gap: 8px; }
    .btn { border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; transition: background 0.2s; color: white; }
    #clear-data-btn { background: #dc2626; }
    #clear-data-btn:hover { background: #ef4444; }
    #fullscreen-btn { background: #4f46e5; }
    #fullscreen-btn:hover { background: #6366f1; }
    
    #main.fullscreen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999;
    }
    iframe { flex: 1; border: none; background: #fff; }

    /* 公開設定フォーム */
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 11px; font-weight: bold; color: #aaa; }
    .form-input { background: #1e1e1e; border: 1px solid #444; color: #fff; padding: 6px 8px; border-radius: 4px; font-size: 12px; outline: none; }
    .form-input:focus { border-color: #646cff; }
    #publish-btn { background: #16a34a; padding: 10px; font-size: 13px; margin-top: 4px; }
    #publish-btn:hover { background: #22c55e; }
    #publish-btn:disabled { background: #555; cursor: not-allowed; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/esbuild-wasm@0.19.11/lib/browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0/dist/umd/supabase.min.js"></script>
</head>
<body>

  <div id="sidebar">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3>G-HUB Zip Runner</h3>
      <a href="index.html" style="color:#646cff; font-size:12px; text-decoration:none;">← ホームへ</a>
    </div>

    <div id="drop-zone">
      <p>📁 Vite/React Zipをドロップ</p>
      <input type="file" id="file-input" accept=".zip">
    </div>

    <div id="status">Wasm モード初期化中...</div>
    <div id="terminal">--- ログ ---<br></div>

    <!-- G-HUB 公開用フォーム -->
    <div class="form-group">
      <label>ゲームタイトル</label>
      <input type="text" id="game-title" class="form-input" placeholder="タイトルを入力">
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
      <div class="form-group">
        <label>ジャンル</label>
        <select id="game-tag" class="form-input">
          <option value="Action">アクション</option>
          <option value="Puzzle">パズル</option>
          <option value="RPG">RPG</option>
          <option value="Horror">ホラー</option>
          <option value="Other">その他</option>
        </select>
      </div>
      <div class="form-group">
        <label>価格 (G-coin)</label>
        <select id="game-price" class="form-input">
          <option value="0">無料 (Free)</option>
          <option value="30">30 G</option>
          <option value="50">50 G</option>
          <option value="100">100 G</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>対応機種</label>
      <div style="display:flex; gap:12px; font-size:11px;">
        <label><input type="checkbox" id="plat-pc" checked> 💻 PC</label>
        <label><input type="checkbox" id="plat-mobile"> 📱 スマホ</label>
        <label><input type="checkbox" id="plat-pad"> 🎮 パッド</label>
      </div>
    </div>

    <div class="form-group">
      <label>説明文・操作方法</label>
      <textarea id="game-desc" class="form-input" rows="2" placeholder="操作方法を入力"></textarea>
    </div>

    <button id="publish-btn" class="btn" onclick="publishToGHub()">🚀 G-HUBに公開する！</button>
  </div>

  <div id="main">
    <div id="iframe-header">
      <span>Preview</span>
      <div class="btn-group">
        <button id="clear-data-btn" class="btn">🗑️ セーブデータ消去</button>
        <button id="fullscreen-btn" class="btn">全画面表示</button>
      </div>
    </div>
    <iframe id="preview-iframe" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-modals allow-pointer-lock"></iframe>
  </div>

  <script>
    const proxyUrl = window.location.origin + '/supabase';
    const supabase = window.supabase.createClient(proxyUrl, 'sb_publishable_cSX9rcWTjbX6lWfyT1KLNQ_tUFYuXtj');

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const terminal = document.getElementById('terminal');
    const iframe = document.getElementById('preview-iframe');
    const statusEl = document.getElementById('status');
    const mainArea = document.getElementById('main');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const clearDataBtn = document.getElementById('clear-data-btn');

    let esbuildReady = false;
    let compiledHtmlForPublish = null; // 公開用の完成HTML

    function log(msg) {
      terminal.innerText += msg + '\n';
      terminal.scrollTop = terminal.scrollHeight;
    }

    // 全画面切り替え機能
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        if (mainArea.requestFullscreen) {
          mainArea.requestFullscreen();
        } else {
          mainArea.classList.add('fullscreen');
        }
        fullscreenBtn.textContent = '全画面解除';
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
        fullscreenBtn.textContent = '全画面表示';
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        mainArea.classList.remove('fullscreen');
        fullscreenBtn.textContent = '全画面表示';
      }
    });

    // セーブデータ（iframe内のストレージ）の削除処理
    clearDataBtn.addEventListener('click', () => {
      if (!iframe.srcdoc) {
        alert("ゲームが読み込まれていません。");
        return;
      }

      if (confirm("現在プレビュー中のゲームのセーブデータ（localStorage）を削除して再読み込みしますか？")) {
        try {
          const iframeWin = iframe.contentWindow;
          if (iframeWin) {
            iframeWin.localStorage.clear();
            iframeWin.sessionStorage.clear();
            
            const currentDoc = iframe.srcdoc;
            iframe.srcdoc = '';
            setTimeout(() => {
              iframe.srcdoc = currentDoc;
              log("🗑️ セーブデータを削除し、プレビューをリセットしました。");
            }, 50);
          }
        } catch (e) {
          log("❌ セーブデータの削除に失敗しました: " + e.message);
        }
      }
    });

    // esbuild-wasm 初期化
    async function initEsbuild() {
      try {
        await esbuild.initialize({
          wasmURL: 'https://cdn.jsdelivr.net/npm/esbuild-wasm@0.19.11/esbuild.wasm'
        });
        esbuildReady = true;
        statusEl.innerText = "⚡ esbuild 準備完了";
        log("✅ esbuild-wasm の初期化が完了しました。");
      } catch (e) {
        log("❌ esbuild 初期化失敗: " + e.message);
      }
    }
    initEsbuild();

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => e.preventDefault());
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length > 0) processZip(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) processZip(e.target.files[0]);
    });

    // ★ ご提示いただいたエンジンそのもの
    async function processZip(file) {
      if (!esbuildReady) {
        alert("esbuild-wasm の準備ができていません。少々お待ちください。");
        return;
      }

      document.getElementById('game-title').value = file.name.replace('.zip', '');
      log(`\n📦 Zipファイルを解析中: ${file.name}`);
      try {
        const zip = await JSZip.loadAsync(file);
        const files = {};

        const paths = Object.keys(zip.files);
        let prefix = '';
        const rootFolders = new Set(paths.map(p => p.split('/')[0]).filter(Boolean));
        if (rootFolders.size === 1 && paths.some(p => p.endsWith('index.html'))) {
          prefix = Array.from(rootFolders)[0] + '/';
        }

        for (const [path, entry] of Object.entries(zip.files)) {
          if (entry.dir) continue;
          let cleanPath = prefix && path.startsWith(prefix) ? path.slice(prefix.length) : path;
          files[cleanPath] = await entry.async('text');
        }

        let html = files['index.html'] || files['public/index.html'];
        if (!html) {
          log('❌ index.html が見つかりませんでした。');
          return;
        }

        const entryCandidates = ['src/main.tsx', 'src/main.jsx', 'src/index.tsx', 'src/index.jsx', 'src/App.tsx', 'src/App.jsx'];
        const entryPath = entryCandidates.find(e => files[e] !== undefined);

        if (!entryPath) {
          // 通常の静的HTMLの場合
          log('ℹ️ 通常のHTMLファイルを検出しました。プレビューを表示します。');
          iframe.srcdoc = html;
          compiledHtmlForPublish = html;
          log('🚀 プレビュー描画完了！');
          return;
        }

        log(`⚡ esbuild でバンドル処理を開始 (${entryPath})...`);

        const zipPlugin = {
          name: 'zip-vfs',
          setup(build) {
            build.onResolve({ filter: /.*/ }, args => {
              let target = args.path.startsWith('/') ? args.path.slice(1) : args.path;

              const isRelative = args.path.startsWith('.');
              const isAbsoluteLocal = files[target] !== undefined;

              if (isRelative || isAbsoluteLocal || args.kind === 'entry-point') {
                if (args.importer) {
                  const basePath = args.importer.split('/').slice(0, -1).join('/');
                  const rawPath = basePath ? basePath + '/' + args.path : args.path;
                  const parts = rawPath.split('/');
                  const stack = [];
                  for (const p of parts) {
                    if (p === '.' || p === '') continue;
                    if (p === '..') stack.pop();
                    else stack.push(p);
                  }
                  target = stack.join('/');
                }

                const exts = ['', '.tsx', '.ts', '.jsx', '.js', '.css', '/index.tsx', '/index.ts', '/index.jsx', '/index.js'];
                for (const ext of exts) {
                  if (files[target + ext] !== undefined) {
                    return { path: target + ext, namespace: 'zip-vfs' };
                  }
                }
                return { path: target, namespace: 'zip-vfs' };
              }

              let pkg = args.path;
              return { path: `https://esm.sh/${pkg}`, external: true };
            });

            build.onLoad({ filter: /.*/, namespace: 'zip-vfs' }, args => {
              const content = files[args.path];
              if (content === undefined) {
                return { errors: [{ text: `File not found in zip: ${args.path}` }] };
              }

              if (args.path.endsWith('.css')) {
                const escapedCss = JSON.stringify(content);
                const js = `
                  const style = document.createElement('style');
                  style.textContent = ${escapedCss};
                  document.head.appendChild(style);
                `;
                return { contents: js, loader: 'js' };
              }

              let loader = 'js';
              if (args.path.endsWith('.tsx')) loader = 'tsx';
              else if (args.path.endsWith('.ts')) loader = 'ts';
              else if (args.path.endsWith('.jsx')) loader = 'jsx';

              return { contents: content, loader: loader };
            });
          }
        };

        const result = await esbuild.build({
          entryPoints: [entryPath],
          bundle: true,
          format: 'esm',
          plugins: [zipPlugin],
          write: false,
          jsx: 'automatic',
          jsxImportSource: 'react'
        });

        const bundledJs = result.outputFiles[0].text;

        log('🔗 html に JS を注入中...');

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const head = doc.head;

        const tailwindScript = doc.createElement('script');
        tailwindScript.src = "https://cdn.tailwindcss.com";
        head.appendChild(tailwindScript);

        const scriptEl = doc.createElement('script');
        scriptEl.type = 'module';
        scriptEl.textContent = bundledJs;

        doc.querySelectorAll('script[type="module"]').forEach(s => s.remove());
        doc.body.appendChild(scriptEl);

        const errScript = doc.createElement('script');
        errScript.textContent = `
          window.onerror = function(msg, url, line) {
            window.parent.postMessage({ type: 'error', msg: msg + ' (Line: ' + line + ')' }, '*');
          };
        `;
        head.appendChild(errScript);

        compiledHtmlForPublish = doc.documentElement.outerHTML;
        iframe.srcdoc = compiledHtmlForPublish;
        log('🚀 プレビュー描画完了！');

      } catch (err) {
        log(`❌ バンドルエラー: ${err.message}`);
      }
    }

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'error') {
        log(`❌ プレビュー内エラー: ${e.data.msg}`);
      }
    });

    // ★ G-HUB への本番公開処理（プレビューで動いたHTMLをそのまま保存）
    async function publishToGHub() {
      const title = document.getElementById('game-title').value;
      const tag = document.getElementById('game-tag').value;
      const price = parseInt(document.getElementById('game-price').value);
      const desc = document.getElementById('game-desc').value;
      const btn = document.getElementById('publish-btn');

      if (!title) return alert('タイトルを入力してください！');
      if (!compiledHtmlForPublish) return alert('ゲームがバンドルされていません。先にZipをドロップしてください！');

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return alert('公開するにはログインが必要です！トップページでログインしてください。');

      btn.disabled = true;
      log('\n🚀 G-HUBにゲームを公開中...');

      try {
        const gameId = crypto.randomUUID();
        const blob = new Blob([compiledHtmlForPublish], { type: 'text/html' });

        await supabase.storage.from('games').upload(`${gameId}/index.html`, blob, {
          contentType: 'text/html',
          upsert: true
        });

        const entryUrl = supabase.storage.from('games').getPublicUrl(`${gameId}/index.html`).data.publicUrl;

        const plats = [];
        if (document.getElementById('plat-pc').checked) plats.push('pc');
        if (document.getElementById('plat-mobile').checked) plats.push('mobile');
        if (document.getElementById('plat-pad').checked) plats.push('pad');

        await supabase.from('games').insert({
          id: gameId,
          title,
          tag,
          description: desc,
          entry_url: entryUrl,
          author_email: user.email,
          platforms: plats.join(','),
          price_coins: price,
          likes_count: 0,
          play_count: 0
        });

        log('🎉 公開完了！プレイ画面へ移動します...');
        alert('ゲームを公開しました！');
        window.location.href = `play.html?id=${gameId}`;
      } catch (err) {
        log(`❌ 公開失敗: ${err.message}`);
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
