<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>プレイ - G-HUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 flex flex-col items-center">
  <div class="w-full max-w-5xl flex justify-between items-center mb-4">
    <a href="index.html" class="text-indigo-400 hover:underline">← 一覧に戻る</a>
    <h1 id="game-title" class="text-xl font-bold">読み込み中...</h1>
  </div>

  <div class="w-full max-w-5xl bg-black rounded-lg overflow-hidden border border-slate-800 aspect-video shadow-2xl">
    <iframe
      id="game-frame"
      src=""
      class="w-full h-full border-0"
      allow="autoplay; fullscreen; gamepad"
      sandbox="allow-scripts allow-same-origin"
    ></iframe>
  </div>

  <div class="w-full max-w-5xl mt-6 bg-slate-900 p-6 rounded-lg border border-slate-800">
    <h2 class="text-lg font-bold mb-2">ゲーム説明</h2>
    <p id="game-desc" class="text-slate-400 whitespace-pre-wrap">説明はありません。</p>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      'https://ddcnoghsiuxfhnwmtpyn.supabase.co',
      'sb_publishable_cSX9rcWTjbX6lWfyT1KLNQ_tUFYuXtj'
    );

    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('id');

    async function loadGame() {
      if (!gameId) return;

      const { data: game, error } = await supabase.from('games').select('*').eq('id', gameId).single();
      if (error || !game) {
        alert('ゲームが見つかりませんでした');
        return;
      }

      document.getElementById('game-title').innerText = game.title;
      document.getElementById('game-desc').innerText = game.description || '説明はありません。';
      document.getElementById('game-frame').src = game.entry_url;
    }

    loadGame();
  </script>
</body>
</html>
